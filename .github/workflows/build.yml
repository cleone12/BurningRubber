name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Smoke test (title screen, a few seconds of racing, back to the title)
        working-directory: build
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          BR_TEST_SCRIPT: ../tests/smoke.txt
          HOME: ${{ runner.temp }}
        run: |
          timeout 60 ./BurningRubber
          test -s smoke_title.bmp && test -s smoke_game.bmp && test -s smoke_shell.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: build/smoke_*.bmp

  macos:
    runs-on: macos-15   # Apple Silicon
    env:
      # Homebrew's SDL2 only runs on the runner's own macOS version, so build it
      # here for the same minimum as the game (CMAKE_OSX_DEPLOYMENT_TARGET).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      SDL2_VERSION: 2.32.10
      SDL2_SHA256: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165
      SDL2_TTF_VERSION: 2.24.0
      SDL2_TTF_SHA256: 0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install pkg-config dylibbundler
      - name: Build SDL2 and SDL2_ttf for macOS 11 and later
        run: |
          SDL_PREFIX="$RUNNER_TEMP/sdl"
          cd "$RUNNER_TEMP"
          curl -sSfL -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz"
          curl -sSfL -o sdl2_ttf.tar.gz "https://github.com/libsdl-org/SDL_ttf/releases/download/release-$SDL2_TTF_VERSION/SDL2_ttf-$SDL2_TTF_VERSION.tar.gz"
          echo "$SDL2_SHA256  sdl2.tar.gz" | shasum -a 256 -c
          echo "$SDL2_TTF_SHA256  sdl2_ttf.tar.gz" | shasum -a 256 -c
          tar xzf sdl2.tar.gz && tar xzf sdl2_ttf.tar.gz
          # the vendored FreeType still asks for CMake 3.0, which CMake 4 refuses
          common="-DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET -DCMAKE_INSTALL_PREFIX=$SDL_PREFIX -DCMAKE_PREFIX_PATH=$SDL_PREFIX -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake -S "SDL2-$SDL2_VERSION" -B sdl2-build $common -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build sdl2-build -j && cmake --install sdl2-build
          cmake -S "SDL2_ttf-$SDL2_TTF_VERSION" -B sdl2_ttf-build $common -DBUILD_SHARED_LIBS=ON -DSDL2TTF_VENDORED=ON -DSDL2TTF_SAMPLES=OFF
          cmake --build sdl2_ttf-build -j && cmake --install sdl2_ttf-build
          echo "SDL_PREFIX=$SDL_PREFIX" >> "$GITHUB_ENV"
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$SDL_PREFIX/lib/pkgconfig"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$SDL_PREFIX"
          cmake --build build -j
      - name: Bundle SDL2 into the app
        run: |
          APP="dist/Burning Rubber.app"
          mkdir -p dist
          cp -R build/BurningRubber.app "$APP"
          dylibbundler -od -b -x "$APP/Contents/MacOS/BurningRubber" -d "$APP/Contents/libs/" -p @executable_path/../libs/ -s "$SDL_PREFIX/lib" < /dev/null
          codesign --force --deep --sign - "$APP"
      - name: Check app bundle
        run: |
          APP="dist/Burning Rubber.app"
          test -f "$APP/Contents/MacOS/BurningRubber"
          test -f "$APP/Contents/Resources/Race.rsrc"
          test -f "$APP/Contents/Resources/Levels.rsrc"
          test -f "$APP/Contents/Resources/fonts/ChicagoFLF.ttf"
          test -f "$APP/Contents/Resources/BurningRubber.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist" | grep -q BurningRubber.icns
          otool -L "$APP/Contents/MacOS/BurningRubber" "$APP"/Contents/libs/*.dylib
          # nothing may still point into Homebrew or the SDL build
          if otool -L "$APP/Contents/MacOS/BurningRubber" "$APP"/Contents/libs/*.dylib | grep -E "/opt/homebrew|/usr/local/(opt|Cellar)|$SDL_PREFIX"; then exit 1; fi
          # everything must load on macOS 11
          for f in "$APP/Contents/MacOS/BurningRubber" "$APP"/Contents/libs/*.dylib; do
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} b && $1=="minos" {print $2; exit}')
            echo "$f: minos $minos"
            test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"
          done
          codesign --verify --deep --strict "$APP"
      - name: Smoke test from inside the bundle
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          BR_TEST_SCRIPT: ${{ github.workspace }}/tests/smoke.txt
          HOME: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          "$GITHUB_WORKSPACE/dist/Burning Rubber.app/Contents/MacOS/BurningRubber" &
          pid=$!
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; exit 1; fi
          wait $pid
          test -s smoke_title.bmp && test -s smoke_game.bmp && test -s smoke_shell.bmp
      - name: Make disk image
        run: |
          cp README.md dist/
          hdiutil create -volname "Burning Rubber" -srcfolder dist -ov -format UDZO BurningRubber-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BurningRubber-mac-apple-silicon
          path: BurningRubber-mac.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 via vcpkg
        run: vcpkg install sdl2:x64-windows sdl2-ttf:x64-windows
      - name: Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release
      - name: Package
        run: |
          $out = "dist/BurningRubber"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/Release/*.exe, build/Release/*.dll, build/Release/*.rsrc $out
          Copy-Item -Recurse build/Release/fonts $out
          Copy-Item README.md $out
          # the Visual C++ runtime, for PCs without the redistributable installed
          Copy-Item C:/Windows/System32/vcruntime140.dll $out
          Get-ChildItem -Recurse $out | Select-Object FullName, Length
          foreach ($f in "BurningRubber.exe", "SDL2.dll", "SDL2_ttf.dll", "Race.rsrc", "Levels.rsrc", "fonts/ChicagoFLF.ttf") {
            if (!(Test-Path "$out/$f")) { Write-Error "missing $f"; exit 1 }
          }
      - name: Smoke test from the packaged folder
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          BR_TEST_SCRIPT: ${{ github.workspace }}/tests/smoke.txt
        run: |
          $dir = "$env:GITHUB_WORKSPACE/dist/BurningRubber"
          $p = Start-Process -FilePath "$dir/BurningRubber.exe" -WorkingDirectory $dir -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); Write-Error "timed out"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "exit code $($p.ExitCode)"; exit 1 }
          foreach ($f in "smoke_title.bmp", "smoke_game.bmp", "smoke_shell.bmp") {
            if (!(Test-Path "$dir/$f")) { Write-Error "missing $f"; exit 1 }
            Remove-Item "$dir/$f"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: BurningRubber-windows-x64
          path: dist/
